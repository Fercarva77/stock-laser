  var c=document.createElement('canvas'),m=Math.max(img.naturalWidth,img.naturalHeight),k=Math.min(1,2000/m)*sc[i];

  if(rot){var d=document.createElement('canvas');d.width=c.height;d.height=c.width;var x=d.getContext('2d');x.translate(d.width/2,d.height/2);x.rotate(Math.PI/2);x.drawImage(c,-c.width/2,-c.height/2);c=d}
